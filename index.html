<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1242">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Третьего не дано</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Телестудия: тёмно-синий павильон с прожекторами, белые карточки вопросов, золото табло.
   Один осознанный вид без тёмной/светлой темы: студия всегда одна. */
:root{
  --studio:#101C5C; --studio-2:#1D2F8A; --night:#0A1242;
  --card:#FFFFFF; --ink:#141A3C; --dim:#5B6390; --rule:#E3E6F2;
  --gold:#FFC21A; --gold-ink:#221900; --magenta:#E8337F; --cyan:#2CC8EE;
  --plate:#15256F; --plate-edge:#5670E0; --plate-ink:#FFFFFF;
  --ok:#18A864; --ok-edge:#7BE3AE; --bad:#DE3F46; --bad-edge:#FF9A9E;
  --f-show:"Unbounded","Arial Black","Segoe UI",system-ui,sans-serif;
  --f-body:"Golos Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  background-color:var(--studio);
  background-image:
    radial-gradient(60% 40% at 8% 0%,rgba(232,51,127,.38),transparent 70%),
    radial-gradient(55% 38% at 95% 2%,rgba(44,200,238,.32),transparent 70%),
    radial-gradient(80% 50% at 50% 105%,rgba(255,194,26,.18),transparent 70%),
    linear-gradient(180deg,var(--studio) 0%,var(--night) 100%);
  background-attachment:fixed;min-height:100vh;
  padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:620px;margin:0 auto;padding-left:16px;padding-right:16px}
h1,h2,.show,.logo,.money,.rt,.rn,.sum,.grade b,.ad-brand{font-family:var(--f-show);font-weight:700}
h2{font-size:17px;line-height:1.25;margin:0 0 10px;letter-spacing:.01em;text-wrap:balance}
p{margin:0 0 8px}
.hint{color:rgba(255,255,255,.72);font-size:13px}
.center{text-align:center}

/* ---------- обложка ---------- */
.cover{padding:calc(36px + env(safe-area-inset-top,0px)) 0 22px;text-align:center;color:#fff}
.onair{display:inline-block;background:var(--magenta);color:#fff;font:700 11px/1 var(--f-show);letter-spacing:.24em;
  text-transform:uppercase;padding:7px 12px 6px;border-radius:3px;box-shadow:0 0 22px rgba(232,51,127,.6)}
.show{font-size:clamp(40px,12vw,58px);line-height:.98;margin:18px 0 12px;letter-spacing:-.02em;text-transform:uppercase;
  color:var(--gold);text-shadow:0 0 30px rgba(255,194,26,.45),0 3px 0 #9A6B00}
.tag{color:rgba(255,255,255,.86);max-width:30ch;margin:0 auto 18px;font-size:15px}
.facts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.facts span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:7px 12px;font-size:12.5px;color:#fff}
.facts b{font-family:var(--f-show);margin-right:5px;color:var(--gold)}
.card{background:var(--card);color:var(--ink);border-radius:14px;padding:16px;margin:0 0 12px;box-shadow:0 10px 28px rgba(5,10,40,.35)}
.form{margin-top:6px}
.field{display:block;margin:0 0 12px}
.field span{display:block;font-size:12px;color:var(--dim);margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase}
.field input{width:100%;min-height:50px;padding:12px 14px;border:1.5px solid var(--rule);border-radius:10px;background:#F7F8FC;font-size:16px}
.field input:focus{border-color:var(--studio-2);outline:none}
.err{color:var(--bad);font-size:13px;min-height:18px;font-weight:500}

/* ---------- шапка ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(10,18,66,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding-top:env(safe-area-inset-top,0px);color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:9px;padding-bottom:8px}
.logo{font-size:11px;line-height:1.05;text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.tb-r{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.money{font-size:19px;color:var(--gold);font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(255,194,26,.4);letter-spacing:-.01em}
.money.bump{animation:bump .5s ease}
.meta{font-size:11.5px;color:rgba(255,255,255,.72)}
.prog{height:3px;background:rgba(255,255,255,.12)}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--magenta),var(--gold))}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

/* ---------- сцена ---------- */
.stage{padding-top:16px}
.host{display:flex;gap:10px;align-items:flex-start;margin:0 0 12px}
.av{flex:0 0 46px;height:46px;border-radius:50%;background:#2A3C9C;border:2px solid var(--gold);overflow:hidden;display:block}
.av svg{width:100%;height:100%;display:block}
.bubble{position:relative;flex:1;min-width:0;background:var(--card);color:var(--ink);border-radius:4px 14px 14px 14px;padding:10px 13px 11px;
  box-shadow:0 8px 22px rgba(5,10,40,.3)}
.bubble b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:2px;font-weight:600}
.bubble p{margin:0;font-size:15px;line-height:1.45}
.bubble.ok{box-shadow:inset 4px 0 0 var(--ok),0 8px 22px rgba(5,10,40,.3)}
.bubble.bad{box-shadow:inset 4px 0 0 var(--bad),0 8px 22px rgba(5,10,40,.3)}
.q .qt{font-size:18px;line-height:1.42;margin:0;font-weight:500}
.quote .qt{font-style:normal}
.sub-q{color:#fff;font-weight:600;font-size:15px;margin:16px 2px 8px}
.pts{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;color:var(--gold-ink);background:var(--gold);border-radius:999px;padding:1px 8px;vertical-align:2px}
.rule{display:flex;gap:12px;padding:9px 0;border-top:1px solid var(--rule);font-size:14.5px}
.rule:first-of-type{border-top:0}
.rule b{flex:0 0 112px;font-weight:600}
.rule span{color:var(--dim)}

/* ---------- плашки ---------- */
.plates{display:grid;gap:9px;margin:0 0 12px}
.plate{--h:16px;display:block;width:100%;text-align:left;padding:2px;background:var(--plate-edge);
  clip-path:polygon(var(--h) 0,calc(100% - var(--h)) 0,100% 50%,calc(100% - var(--h)) 100%,var(--h) 100%,0 50%)}
.plate > span{display:flex;gap:10px;align-items:baseline;background:var(--plate);color:var(--plate-ink);min-height:50px;
  padding:13px calc(var(--h) + 10px);line-height:1.35;font-size:15px;
  clip-path:polygon(var(--h) 0,calc(100% - var(--h)) 0,100% 50%,calc(100% - var(--h)) 100%,var(--h) 100%,0 50%)}
.plate em{font-style:normal;font-family:var(--f-show);font-weight:700;color:var(--gold);font-size:13px;flex:0 0 auto}
.plate:not([disabled]):active > span{background:#22358F}
.plate.ok{background:var(--ok-edge)} .plate.ok > span{background:var(--ok)} .plate.ok em{color:#fff}
.plate.bad{background:var(--bad-edge)} .plate.bad > span{background:var(--bad)} .plate.bad em{color:#fff}
.plate.off{opacity:.45}
.plate[disabled]{cursor:default}

/* ---------- раунды ---------- */
.round,.sp-head{text-align:center;color:#fff;padding:14px 0 16px}
.rn{display:inline-block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--cyan)}
.rt{font-size:clamp(28px,8.5vw,40px);line-height:1.02;margin:8px 0 10px;text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance;color:#fff}
.round .rt{color:var(--gold);text-shadow:0 0 26px rgba(255,194,26,.4)}
.law{display:inline-block;font-size:13px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 12px;color:#fff}
.round.super .rt{font-size:clamp(34px,10vw,48px);color:#fff;text-shadow:0 0 30px rgba(232,51,127,.7)}
.sp-head{padding-bottom:12px}
.sp-head .rt{font-size:clamp(22px,6.5vw,28px)}

/* ---------- реклама ---------- */
.banked{display:flex;justify-content:space-between;align-items:baseline;gap:10px;color:#fff;border:1.5px solid var(--gold);
  border-radius:12px;padding:12px 14px;margin:0 0 16px;background:rgba(255,194,26,.08)}
.banked span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.banked b{font-family:var(--f-show);color:var(--gold);font-size:20px;font-variant-numeric:tabular-nums}
.ad{position:relative;background:var(--card);border-radius:16px;padding:22px 18px 20px;overflow:hidden;
  box-shadow:0 12px 30px rgba(5,10,40,.4);border-top:8px solid var(--magenta)}
.ad::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--gold);opacity:.22}
.ad-chip{display:inline-block;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);border:1px solid var(--rule);
  border-radius:3px;padding:3px 8px;margin-bottom:12px}
.ad-brand{font-size:24px;line-height:1.1;margin:0 0 10px;color:var(--magenta);transform:rotate(-1.5deg);transform-origin:left;text-wrap:balance}
.ad-text{font-size:18px;line-height:1.4;font-weight:500;margin:0 0 14px}
.ad-small{font-size:11.5px;color:var(--dim);margin:0;font-style:italic}

/* ---------- гость, звонок ---------- */
.guest{display:flex;gap:12px;align-items:center;color:#fff;margin:2px 0 12px}
.gav{flex:0 0 56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:12px;
  background:var(--cyan);color:var(--night);border:2px solid #fff}
.gav svg{width:100%;height:100%}
.g-key{background:var(--gold)} .g-wheat{background:#F0D27A} .g-plate{background:#9FE4C4} .g-wrench{background:#F69BC0}
.guest b{display:block;font-size:16px}
.guest span{display:block;font-size:13px;color:rgba(255,255,255,.75)}
.call{display:flex;align-items:center;gap:10px;color:#fff;font-size:14px;margin:2px 0 12px}
.ring{flex:0 0 38px;height:38px;border-radius:50%;background:var(--magenta);display:flex;align-items:center;justify-content:center;padding:9px;color:#fff;
  box-shadow:0 0 0 0 rgba(232,51,127,.6);animation:ring 1.6s ease-out infinite}
.ring svg{width:100%;height:100%}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(232,51,127,.55)}100%{box-shadow:0 0 0 14px rgba(232,51,127,0)}}

/* ---------- супер-игра ---------- */
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:0 0 12px}
.day{background:var(--card);color:var(--ink);border-radius:10px;padding:10px 4px 9px;text-align:center;min-height:66px;
  box-shadow:0 6px 16px rgba(5,10,40,.3);transition:transform .15s}
.day b{display:block;font-family:var(--f-show);font-size:16px}
.day em{display:block;font-style:normal;font-size:10.5px;margin-top:4px;color:var(--dim);letter-spacing:.02em}
.day.target{box-shadow:0 0 0 3px var(--gold),0 6px 16px rgba(5,10,40,.3)}
.day.x{background:#C9CDE0;color:#6B7194}
.day.x b{text-decoration:line-through;text-decoration-thickness:2px}
.day.quiet{background:#DCE0EF}
.day.exam{background:var(--magenta);color:#fff;transform:scale(1.06)}
.day.exam em{color:#fff;font-weight:600}
.day.nope{animation:nope .35s}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.twist{border-left:5px solid var(--magenta)}
.twist p{font-weight:500;margin:0}
.jcard{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.side{background:#FFF8E1;border:2px dashed #E0B640;border-radius:12px;padding:12px;min-width:0;color:var(--ink)}
.side.b{background:#FDEBF3;border-color:#E58AB4}
.side span{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.side p{margin:0;font-weight:600;font-size:15px;line-height:1.35}
.tries{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.chain{list-style:none;margin:0 0 10px;padding:12px 14px;background:var(--card);border-radius:12px;counter-reset:c}
.chain li{position:relative;padding:4px 0 4px 26px;font-size:14.5px;counter-increment:c}
.chain li::before{content:counter(c);position:absolute;left:0;top:5px;width:18px;height:18px;border-radius:50%;background:var(--studio-2);color:#fff;
  font:700 10px/18px var(--f-show);text-align:center}
.chain li.boom{color:var(--bad);font-weight:600}
.chain li.boom::before{background:var(--bad);content:"!"}
.words{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.word{position:relative;background:var(--card);color:var(--ink);border-radius:8px;padding:9px 12px;font-size:16px;font-weight:500;
  box-shadow:0 5px 14px rgba(5,10,40,.28)}
.word.on{background:var(--gold);color:var(--gold-ink)}
.word i{position:absolute;top:-8px;right:-6px;font:700 10px/18px var(--f-show);font-style:normal;background:var(--magenta);color:#fff;
  min-width:18px;height:18px;border-radius:9px;text-align:center;padding:0 4px}
.counter{display:flex;align-items:baseline;justify-content:center;gap:8px;color:#fff;margin:0 0 12px}
.counter b{font-family:var(--f-show);font-size:34px;color:var(--gold);font-variant-numeric:tabular-nums}
.counter span{font-size:13px;color:rgba(255,255,255,.75)}

/* ---------- кнопки ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(10,18,66,0),rgba(10,18,66,.92) 34%)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:12px;
  background:var(--gold);color:var(--gold-ink);font:700 15px/1.2 var(--f-show);letter-spacing:.02em;padding:12px 16px;
  box-shadow:0 6px 0 #A37300,0 12px 24px rgba(0,0,0,.3)}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:0 3px 0 #A37300,0 8px 18px rgba(0,0,0,.3)}
.btn[disabled]{background:#56608F;color:#C3C8E3;box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.4);box-shadow:none;font-size:13.5px;min-height:48px}
.btn.ghost.used{border-color:var(--gold);color:var(--gold)}
.center .btn.ghost{display:inline-flex;width:auto;padding:12px 22px;margin:4px 0 12px}
.link{color:rgba(255,255,255,.7);text-decoration:underline;font-size:13px;padding:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ---------- финал ---------- */
.final{text-align:center;color:#fff;padding:calc(30px + env(safe-area-inset-top,0px)) 0 18px}
.won{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.75);margin:18px 0 2px}
.sum{font-size:clamp(34px,11vw,52px);color:var(--gold);margin:0 0 14px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  text-shadow:0 0 30px rgba(255,194,26,.5),0 3px 0 #9A6B00}
.grade{display:inline-flex;align-items:center;gap:12px;background:var(--card);color:var(--ink);border-radius:14px;padding:10px 18px 10px 12px}
.grade b{font-size:46px;line-height:1;color:var(--magenta)}
.final.gold .grade b{color:#C58A00}
.grade span{font-weight:600;font-size:15px}
.pts-line{margin:12px 0 0;font-size:13px;color:rgba(255,255,255,.78)}
.rbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-top:1px solid var(--rule);font-size:14.5px}
.rbar:first-of-type{border-top:0}
.rbar b{font-variant-numeric:tabular-nums}
.rbar i{grid-column:1/-1;height:6px;border-radius:3px;background:#E8EAF4;overflow:hidden}
.rbar s{display:block;height:100%;background:linear-gradient(90deg,var(--magenta),var(--gold))}
.miss summary{cursor:pointer;font-weight:600;list-style:none}
.miss summary::-webkit-details-marker{display:none}
.miss summary::after{content:" ▾";color:var(--dim)}
.mrow{border-top:1px solid var(--rule);padding:10px 0 4px}
.mrow:first-of-type{margin-top:8px}
.mk{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--magenta);margin-bottom:3px}
.mrow p{margin:0 0 4px;font-size:14px}
.mrow .hint{color:var(--dim)}
@media (prefers-reduced-motion:reduce){.ring,.money.bump,.day.nope{animation:none}.day{transition:none}}
@media (max-width:360px){.rule b{flex-basis:92px}.q .qt{font-size:17px}.day em{font-size:9.5px}.day b{font-size:14px}.cal{gap:5px}}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============================================================
   «ТРЕТЬЕГО НЕ ДАНО». Телевикторина-пародия.
   Тема 2, пара 9: закон исключённого третьего, парадоксы,
   закон достаточного основания.
   Максимум 50 баллов = 1 000 000 ₽ на табло.
   ============================================================ */
var PASS_HASH = 1127430439;   // пароль преподавателя: «пароль»
var MINUTES = 45;
var RUB_PER_POINT = 20000;
var HOST = "Игорь Белов";

var INTRO = {
  hello: "Добрый вечер! В эфире «Третьего не дано» — единственная программа, где на каждый вопрос есть ровно два ответа. Почти всегда.",
  rules: [
    ["Четыре раунда", "«Либо — либо», «Гость студии», «Звонок в студию» и супер-игра."],
    ["Ответ один раз", "Нажали — ответ засчитан. Переиграть нельзя, как в настоящем эфире."],
    ["Табло", "Каждый балл — 20 000 ₽. Пятьдесят баллов — миллион."],
    ["Оценка", "Выставляется сразу после супер-игры."]
  ]
};

/* ---------- Раунд 1. Исключённое третье ---------- */
var R1 = {
  title: "Либо — либо",
  law: "Закон исключённого третьего",
  rule: "Из двух противоречащих высказываний одно обязательно истинно, третьего не дано. Но работает закон только для противоречащих: одно должно целиком отрицать другое. «Горячий» и «холодный» — не такая пара: между ними есть «тёплый».",
  ask: "Здесь действительно третьего не дано?",
  items: [
    { id: "a1", t: "Подсудимый либо виновен в предъявленном обвинении, либо не виновен.", third: null,
      why: "Противоречащая пара: второе высказывание целиком отрицает первое. Третьего не дано. Доказана ли вина — уже вопрос доказательств, а не логики." },
    { id: "a2", t: "Сделка либо действительна, либо ничтожна.",
      third: ["Оспоримая: действует, пока суд не признает её недействительной", "Сделка, заключённая в выходной день", "Устная сделка"],
      why: "«Действительна» и «ничтожна» — противоположности, а не противоречие. Между ними — оспоримая сделка." },
    { id: "a3", t: "Свидетель либо говорит правду, либо лжёт.",
      third: ["Добросовестно заблуждается: говорит неправду, искренне считая её правдой", "Говорит правду, но неохотно", "Говорит тихо и неразборчиво"],
      why: "Лгать — значит говорить неправду намеренно. Тот, кто искренне ошибается, не лжёт, но и правды не говорит." },
    { id: "a4", t: "Число 2026 либо делится на два без остатка, либо не делится.", third: null,

var STEPS = null;
function buildSteps() {

  st.push({ type: "ad", i: 1, after: 2 });
  st.push({ type: "round", n: 3 });
  shuffle(R3.calls, r).forEach(function (c) { st.push({ type: "call", c: c }); });
  st.push({ type: "ad", i: 2, after: 3 });
  st.push({ type: "round", n: 4 });

}
function steps() { return STEPS || (STEPS = buildSteps()); }

/* ---------- баллы ---------- */
function ptsR1(it) {

}
function ptsGuest(g) { var a = S.ans[g.id] || []; return g.qs.reduce(function (n, q, i) { return n + (a[i] === q.a ? 1 : 0); }, 0); }
function ptsCall(c) { return S.ans[c.id] === c.a ? 1 : 0; }

  R2.guests.forEach(function (x) { t.r2 += ptsGuest(x); });
  R3.calls.forEach(function (x) { t.r3 += ptsCall(x); });
  SUPER.items.forEach(function (x) { t.sp += ptsSuper(x); });
  t.max = { r1: maxR1(), r2: R2.guests.length * 2, r3: R3.calls.length, sp: SUPER.items.length * 4 };
  t.sum = t.r1 + t.r2 + t.r3 + t.sp;

  t.pct = Math.round(t.sum / t.all * 100);
  for (var i = 0; i < MARKS.length; i++) if (t.pct >= MARKS[i][1]) { t.mark = MARKS[i][0]; t.word = MARKS[i][2]; break; }

}

  if (st.type === "guest") { var g = S.ans[st.g.id] || []; return g.length === st.g.qs.length && g[g.length - 1] != null; }
  if (st.type === "call") return S.ans[st.c.id] != null;
  if (st.type === "super") { var s = (S.ans[st.s.id] || {}).q || []; return s.length === st.s.qs.length && s[s.length - 1] != null; }

}

  var h = '<section class="final' + (t.mark === 5 ? " gold" : "") + '"><div class="wrap">' +
    '<span class="onair">Эфир окончен</span>' +
    '<p class="won">Выигрыш</p><p class="sum">' + fmt(t.sum * RUB_PER_POINT) + ' ₽</p>' +
    '<div class="grade"><b>' + t.mark + '</b><span>' + t.word + '</span></div>' +
    '<p class="pts-line">' + t.sum + ' из ' + t.all + ' баллов · ' + t.pct + '% · ' + minutes() + ' мин</p>' +
    '</div></section><main class="wrap stage">' +
    '<div class="card"><h2>По раундам</h2>' +
      bar("«Либо — либо»", t.r1, t.max.r1) + bar("«Гость студии»", t.r2, t.max.r2) +
      bar("«Звонок в студию»", t.r3, t.max.r3) + bar("Супер-игра", t.sp, t.max.sp) +
    '</div>' +
    (miss.length ? '<details class="card miss"><summary>Где были ошибки · ' + miss.length + '</summary>' +
      miss.map(function (m) { return '<div class="mrow"><span class="mk">' + esc(m.where) + '</span><p>' + esc(m.t) + '</p><p class="hint">' + esc(m.why) + '</p></div>'; }).join("") +
      '</details>' : '<div class="card"><p>Ни одной ошибки. Студия аплодирует стоя.</p></div>') +
    '<p class="hint center">' + esc(S.name) + (S.group ? ", " + esc(S.group) : "") + ' · ' + d.toLocaleDateString("ru-RU") + ' ' +
      d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }) + '</p>' +
    (ui.reset
      ? '<div class="card"><label class="field"><span>Пароль преподавателя</span><input id="pw" type="password" autocomplete="off"></label>' +
        '<p class="err">' + esc(ui.pwErr) + '</p><div class="row2"><button class="btn" data-act="reset2">Начать заново</button>' +
        '<button class="btn ghost" data-act="noreset">Отмена</button></div></div>'
      : '<div class="center"><button class="link" data-act="reset">Новая попытка (нужен пароль преподавателя)</button></div>') +
    '</main>';
  app.innerHTML = h;
}
function bar(name, got, max) {
  return '<div class="rbar"><span>' + esc(name) + '</span><b>' + got + ' / ' + max + '</b><i><s style="width:' + Math.round(got / max * 100) + '%"></s></i></div>';
}
function mistakes() {
  var out = [];
  R1.items.forEach(function (it) {
    var want = it.third ? 2 : 1; if (ptsR1(it) < want) out.push({ where: "Раунд 1", t: it.t, why: it.why });
  });
  R2.guests.forEach(function (g) {
    var a = S.ans[g.id] || [];
    g.qs.forEach(function (q, i) { if (a[i] !== q.a) out.push({ where: "Раунд 2 · " + g.name, t: q.q, why: q.why }); });
  });
  R3.calls.forEach(function (c) { if (S.ans[c.id] !== c.a) out.push({ where: "Раунд 3 · " + c.who, t: c.t, why: "Верно: " + R3.cats[c.a] + ". " + c.why }); });
  SUPER.items.forEach(function (s) {
    var a = (S.ans[s.id] || {}).q || [];
    s.qs.forEach(function (q, i) { if (a[i] !== q.a) out.push({ where: "Супер-игра · " + s.title, t: q.q, why: q.why }); });
  });
  return out;
}

/* ---------- действия ---------- */
document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  var act = el.getAttribute("data-act"), top = false;

  if (act === "start") {
    if (!draft.name.trim()) { draft.err = "Представьтесь, пожалуйста: фамилия и имя."; renderStart(); return; }
    S = { name: draft.name.trim(), group: draft.group.trim(), seed: (Math.random() * 4294967296) >>> 0,
      startedAt: Date.now(), pos: 0, ans: {} };
    STEPS = null; top = true;
  } else if (!S) return;
  else {
    var st = steps()[S.pos], k = +el.getAttribute("data-k");
    if (act === "next" && stepDone(st)) { S.pos = Math.min(S.pos + 1, steps().length - 1); top = true; }
    if (act === "r1v") { var vb = ["none", "third"]; S.ans[st.it.id] = { v: vb[k], t: null }; }
    if (act === "r1t") { S.ans[st.it.id].t = k; }
    if (act === "gq") { var gi = +el.getAttribute("data-i"), ga = S.ans[st.g.id] || []; if (ga[gi] == null) { ga[gi] = k; S.ans[st.g.id] = ga; } }
    if (act === "cq") { if (S.ans[st.c.id] == null) S.ans[st.c.id] = k; }
    if (act === "sq") { var si = +el.getAttribute("data-i"), sa = S.ans[st.s.id] || {}; sa.q = sa.q || []; if (sa.q[si] == null) sa.q[si] = k; S.ans[st.s.id] = sa; }
    if (act === "cross") {
      var ca = S.ans[st.s.id] || {}; ca.cross = ca.cross || [];
      var d = +el.getAttribute("data-d"), need = st.s.steps[ca.cross.length];
      if (need && need.day === d) { ca.cross.push(d); S.ans[st.s.id] = ca; }
      else { el.classList.remove("nope"); void el.offsetWidth; el.classList.add("nope"); return; }
    }
    if (act === "week") { var wa = S.ans[st.s.id] || {}; wa.week = true; S.ans[st.s.id] = wa; }
    if (act === "try") { var ta = S.ans[st.s.id] || {}; ta.tr = ta.tr || {}; ta.tr[el.getAttribute("data-v")] = true; S.ans[st.s.id] = ta; }
    if (act === "word") {
      var wa2 = S.ans[st.s.id] || {}; wa2.w = wa2.w || [];
      var wi = +el.getAttribute("data-w"); if (wa2.w.indexOf(wi) < 0) wa2.w.push(wi); S.ans[st.s.id] = wa2;
    }
    if (act === "reset") ui.reset = true;
    if (act === "noreset") { ui.reset = false; ui.pwErr = ""; }
    if (act === "reset2") {
      var v = ((document.getElementById("pw") || {}).value || "").trim().toLowerCase();
      if (hashStr(v) === PASS_HASH) { S = null; STEPS = null; ui.reset = false; ui.pwErr = ""; draft = { name: "", group: "", err: "" }; save(); render(); window.scrollTo(0, 0); return; }
      ui.pwErr = "Неверный пароль.";
    }
  }
  save(); render();
  if (top) window.scrollTo(0, 0);
});

setInterval(function () {
  var c = document.getElementById("clock");
  if (c && S && !S.finishedAt) c.textContent = minutes() + "/" + MINUTES + " мин";
}, 20000);

render();

</script>
